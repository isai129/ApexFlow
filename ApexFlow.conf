[Host]
*.apple.com = server:system
*.icloud.com = server:system
# 保留 Tailscale MagicDNS 与 mDNS 走系统解析，避免 DoH 解析不到私有域名/.local
*.ts.net = server:system
*.local = server:system
# QuickConnect 动态域名（syn-xxx.direct.quickconnect.cn 等）TTL 极短，且家庭 DNS 会给空应答；
# 直接指定公共解析器，避免解析失败后触发 dns-direct-fallback-proxy 把 NAS 流量送进节点
*.quickconnect.cn = server:223.5.5.5
*.quickconnect.to = server:223.5.5.5
localhost = 127.0.0.1

[URL Rewrite]
# Google 中国域名防跳转
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302
