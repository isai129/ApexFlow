[Host]
*.apple.com = server:system
*.icloud.com = server:system
*.local = server:system
# QuickConnect 动态域名：家庭 DNS 空应答问题，指定公共解析器（SR v8.4 同款修复）
*.quickconnect.cn = server:223.5.5.5
*.quickconnect.to = server:223.5.5.5
localhost = 127.0.0.1
# ts.net 不映射 system：Tailscale 节点 accept-dns/magic-dns 自动接管 MagicDNS 解析

[Rewrite]
# Google 中国域名防跳转
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[Plugin]
# iRingo WeatherKit v3.3.2（镜像到 ApexFlow Pages，脚本 URL 已重写为镜像地址）
# 解锁完整天气数据 + 空气质量替换 + 未来一小时降水；配置在插件参数里改（默认彩云天气源）
https://isai129.github.io/ApexFlow/vendor/iRingo.WeatherKit.lpx,tag=iRingo-WeatherKit,enable=true

[MITM]
# 默认关闭。生成+安装+信任 Loon CA 证书后改 true（或 UI 开启 HTTPS 解密）
# WeatherKit 插件自带 weatherkit.apple.com hostname（%APPEND%）
enable = false
hostname = weatherkit.apple.com
